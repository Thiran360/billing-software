name: Build Android APK

on:
  push:
    branches: [ main, apk-build ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle via apt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gradle

      - name: Generate Gradle Wrapper (creates gradle-wrapper.jar)
        working-directory: android
        run: gradle wrapper --gradle-version=8.4 --distribution-type=bin

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MustafaStoreBilling-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/apk-build'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0-apk --yes 2>/dev/null || true
          gh release create v1.0.0-apk \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Mustafa Billing Mobile App APK (v1.0.0)" \
            --notes "Download **app-debug.apk** and install on your Android phone. Enable 'Install unknown apps' in phone settings first." \
            --prerelease
